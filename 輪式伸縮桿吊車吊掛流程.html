<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>輪式伸縮桿吊車吊掛流程</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: 3D stage fills the left, slate control column on the right, full-width timeline along the bottom. Single theme by choice. */
:root{
  color-scheme: dark;
  --sky:#d9e2e7;
  --panel:#1b252e;
  --panel-2:#243240;
  --line:#35475a;
  --ink:#e8eef2;
  --muted:#93a4b3;
  --accent:#f2b705;      /* crane yellow */
  --warn:#ff7a59;
  --ok:#57c794;
  --g0:#5b7fa6; --g1:#3f9c9a; --g2:#c9962a; --g3:#8a78b8;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-num:"Barlow Condensed","Noto Sans TC",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--panel);color:var(--ink);
  font-family:var(--font-body);font-size:14px;line-height:1.5;
  display:flex;flex-direction:column;overflow:hidden;
}
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 340px}
.stage{position:relative;min-height:0;background:var(--sky);overflow:hidden}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

.hud{
  position:absolute;left:16px;top:16px;right:16px;pointer-events:none;
  display:flex;flex-direction:column;gap:10px;align-items:flex-start;
}
.stepcard{
  background:rgba(27,37,46,.92);border-left:4px solid var(--accent);
  padding:8px 14px 9px;border-radius:2px;max-width:min(460px,100%);
}
.stepcard .eyebrow{font-family:var(--font-num);font-size:14px;letter-spacing:.06em;color:var(--muted)}
.stepcard .name{font-size:17px;font-weight:700;text-wrap:balance}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  background:rgba(27,37,46,.88);padding:3px 10px;border-radius:999px;font-size:12.5px;
  display:flex;align-items:center;gap:6px;
}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.chip.ok::before{background:var(--ok)}
.chip.on::before{background:var(--accent)}
.chip.warn{color:#ffd9cf}.chip.warn::before{background:var(--warn)}
.chip[hidden]{display:none}

.readout{
  position:absolute;left:16px;bottom:14px;pointer-events:none;
  display:grid;grid-template-columns:repeat(5,auto);gap:2px 18px;
  background:rgba(27,37,46,.9);padding:8px 14px;border-radius:2px;
}
.readout div{display:flex;flex-direction:column}
.readout dt{font-size:11.5px;color:var(--muted)}
.readout dd{margin:0;font-family:var(--font-num);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.readout dd small{font-size:13px;color:var(--muted);font-weight:500;margin-left:2px}
.viewbtn{position:absolute;right:16px;bottom:14px}

.panel{
  background:var(--panel);border-left:1px solid var(--line);
  overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:18px;min-height:0;
}
.panel h2{font-size:12.5px;font-weight:500;color:var(--muted);margin:0 0 8px;letter-spacing:.08em}
.ctl{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:baseline;margin-bottom:11px}
.ctl label{font-weight:500}
.ctl output{font-family:var(--font-num);font-size:17px;font-variant-numeric:tabular-nums;color:var(--accent)}
.ctl input{grid-column:1/-1;width:100%;margin:2px 0 0;accent-color:var(--accent);height:22px;cursor:pointer}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.steps .grp{font-size:12px;color:var(--muted);margin:8px 0 2px;display:flex;align-items:center;gap:6px}
.steps .grp i{width:10px;height:10px;border-radius:2px;display:inline-block}
.steps button{
  width:100%;text-align:left;background:none;border:0;color:var(--ink);font:inherit;
  padding:5px 8px;border-radius:3px;cursor:pointer;display:flex;gap:8px;
}
.steps button span{font-family:var(--font-num);color:var(--muted);min-width:18px;font-variant-numeric:tabular-nums}
.steps button:hover{background:var(--panel-2)}
.steps button[aria-current="step"]{background:var(--panel-2);box-shadow:inset 3px 0 0 var(--accent)}
.note{font-size:12px;color:var(--muted);margin:0}

.bar{
  border-top:1px solid var(--line);background:var(--panel);
  padding:10px 16px 12px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 14px;align-items:center;
}
.btns{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
button.b,select.b{
  font:inherit;color:var(--ink);background:var(--panel-2);border:1px solid var(--line);
  padding:6px 12px;border-radius:4px;cursor:pointer;
}
button.b:hover,select.b:hover{border-color:var(--muted)}
button.b.primary{background:var(--accent);color:#1b1a12;border-color:var(--accent);font-weight:700;min-width:72px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tl{min-width:0}
.track{position:relative;height:30px}
.segs{position:absolute;inset:6px 0;display:flex;gap:2px}
.segs i{display:block;height:100%;opacity:.45;border-radius:1px}
.segs i.done{opacity:.95}
.segs i.cur{opacity:1;outline:1px solid var(--ink)}
.track input{
  position:absolute;inset:0;width:100%;height:100%;margin:0;background:none;
  -webkit-appearance:none;appearance:none;cursor:ew-resize;
}
.track input::-webkit-slider-runnable-track{background:none;height:30px}
.track input::-moz-range-track{background:none;height:30px}
.track input::-webkit-slider-thumb{-webkit-appearance:none;width:6px;height:30px;background:var(--ink);border-radius:2px;box-shadow:0 0 0 2px var(--panel)}
.track input::-moz-range-thumb{width:6px;height:30px;background:var(--ink);border:0;border-radius:2px;box-shadow:0 0 0 2px var(--panel)}
.groups{display:flex;gap:2px;margin-top:3px;font-size:12px;color:var(--muted)}
.groups span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border-top:2px solid;padding-top:2px}
.time{font-family:var(--font-num);font-size:16px;font-variant-numeric:tabular-nums;color:var(--muted);min-width:92px}

@media (max-width:820px){
  .main{grid-template-columns:1fr;grid-template-rows:46% minmax(0,1fr)}
  .panel{border-left:0;border-top:1px solid var(--line)}
  .readout{grid-template-columns:repeat(3,auto);gap:2px 12px;padding:6px 10px}
  .readout dd{font-size:18px}
  .readout .opt{display:none}
  .viewbtn{bottom:auto;top:16px}
  .hud{right:96px}
  .stepcard .name{font-size:15px}
  .bar{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="main">
  <div class="stage" id="stage">
    <canvas id="gl" aria-label="輪式伸縮桿吊車 3D 場景，可拖曳旋轉視角"></canvas>
    <div class="hud">
      <div class="stepcard">
        <div class="eyebrow" id="stepNo">步驟 1 / 19</div>
        <div class="name" id="stepName">車輛就位</div>
      </div>
      <div class="chips">
        <span class="chip" id="chipOut">駐腳未伸出</span>
        <span class="chip" id="chipLoad">吊物未掛勾</span>
        <span class="chip on" id="chipManual" hidden>手動調整中，拖時間軸可回到流程</span>
        <span class="chip warn" id="chipWarn" hidden>駐腳未完全伸出並頂升，不得起吊</span>
      </div>
    </div>
    <dl class="readout">
      <div><dt>桿長</dt><dd><span id="rLen">0</span><small>m</small></dd></div>
      <div><dt>仰角</dt><dd><span id="rLuff">0</span><small>°</small></dd></div>
      <div><dt>作業半徑</dt><dd><span id="rRad">0</span><small>m</small></dd></div>
      <div class="opt"><dt>旋轉角</dt><dd><span id="rSlew">0</span><small>°</small></dd></div>
      <div class="opt"><dt>勾頭高度</dt><dd><span id="rHook">0</span><small>m</small></dd></div>
    </dl>
    <button class="b viewbtn" id="resetView" type="button">重設視角</button>
  </div>

  <aside class="panel">
    <section>
      <h2>駐腳</h2>
      <div class="ctl"><label for="sOutH">水平外伸（全車四支）</label><output id="oOutH"></output>
        <input id="sOutH" type="range" min="0" max="1" step="0.01"></div>
      <div class="ctl"><label for="sOutV">垂直伸出（全車四支）</label><output id="oOutV"></output>
        <input id="sOutV" type="range" min="0" max="1" step="0.01"></div>
    </section>
    <section>
      <h2>上部機構</h2>
      <div class="ctl"><label for="sSlew">上部旋轉</label><output id="oSlew"></output>
        <input id="sSlew" type="range" min="0" max="360" step="0.5"></div>
      <div class="ctl"><label for="sLuff">仰傾角</label><output id="oLuff"></output>
        <input id="sLuff" type="range" min="0" max="80" step="0.5"></div>
      <div class="ctl"><label for="sTele">伸縮桿</label><output id="oTele"></output>
        <input id="sTele" type="range" min="0" max="1" step="0.005"></div>
      <div class="ctl"><label for="sRope">勾頭上下（鋼索放出）</label><output id="oRope"></output>
        <input id="sRope" type="range" min="1.6" max="34" step="0.05"></div>
    </section>
    <section>
      <h2>作業流程</h2>
      <ol class="steps" id="stepList"></ol>
    </section>
    <p class="note">示意模型，尺寸與動作不對應特定機型。實際作業以該機額定荷重表與現場吊掛指揮為準。</p>
  </aside>
</div>

<div class="bar">
  <div class="btns">
    <button class="b primary" id="play" type="button">播放</button>
    <button class="b" id="prev" type="button">上一步</button>
    <button class="b" id="next" type="button">下一步</button>
    <select class="b" id="speed" aria-label="播放速度">
      <option value="0.5">0.5×</option><option value="1">1×</option>
      <option value="2" selected>2×</option><option value="4">4×</option>
    </select>
    <span class="time" id="time">0.0 / 0.0 s</span>
  </div>
  <div class="tl">
    <div class="track">
      <div class="segs" id="segs"></div>
      <input id="timeline" type="range" min="0" max="100" step="0.01" value="0" aria-label="流程時間軸">
    </div>
    <div class="groups" id="groups"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
"use strict";
var D2R = Math.PI/180;
var $ = function(id){ return document.getElementById(id); };

/* ---------- geometry constants (metres) ---------- */
var C = {
  cx:-1.5, deckY:1.6,          // slewing centre on carrier
  px:-1.6, py:1.3,             // boom foot pin, in upper-structure frame
  L0:10.5, secLen:10.2, secStep:0.35, ext:7.8,
  headX:0.2, headY:-0.4,       // rope drop point relative to boom tip
  slingH:1.4, loadW:2.4, loadH:1.0, loadD:1.2,
  ropeMin:1.6, ropeMax:34,
  beamTravel:2.4, jackStroke:0.73, jackGap:0.55,
  platH:5
};
function liftOf(outV){ return Math.max(0, outV*C.jackStroke - C.jackGap); }
function boomLen(tele){ return C.L0 + 3*(C.secStep + C.ext*tele); }
function fk(s){
  var a = s.luff*D2R, th = s.slew*D2R, L = boomLen(s.tele);
  var hx = L + C.headX, hy = C.headY;
  var x = C.px + hx*Math.cos(a) - hy*Math.sin(a);
  var y = C.py + hx*Math.sin(a) + hy*Math.cos(a);
  var lift = liftOf(s.outV);
  return { L:L, radius:x, lift:lift,
    hx: C.cx + x*Math.cos(th), hy: C.deckY + lift + y, hz: -x*Math.sin(th) };
}

/* ---------- process steps ---------- */
var GROUPS = [
  {name:"吊掛準備", color:"var(--g0)"},
  {name:"對位掛勾", color:"var(--g1)"},
  {name:"吊運卸放", color:"var(--g2)"},
  {name:"收車",     color:"var(--g3)"}
];
var restHook = C.loadH + C.slingH;
var steps = [
  {g:0, name:"車輛就位，確認地盤與作業範圍", dur:3,  set:{}},
  {g:0, name:"全車駐腳水平外伸",             dur:6,  set:{outH:1}},
  {g:0, name:"駐腳垂直伸出，頂升車身調平",   dur:6,  set:{outV:1}},
  {g:1, name:"鬆勾，仰起吊桿",               dur:7,  set:{luff:50, rope:4}},
  {g:1, name:"上部旋轉，對準吊物",           dur:7,  set:{slew:70}},
  {g:1, name:"伸出伸縮桿到吊物正上方",       dur:6,  set:{tele:0.3}},
  {g:1, name:"降勾，掛妥吊索",               dur:7,  set:{}, hookY:restHook, attach:true},
  {g:2, name:"試吊：離地 30 cm",             dur:2.5,set:{}, hookY:restHook+0.3},
  {g:2, name:"停留確認吊索、駐腳與剎車",     dur:2.5,set:{}},
  {g:2, name:"起升到越障高度",               dur:6,  set:{}, hookY:9.6},
  {g:2, name:"上部旋轉到卸放方位",           dur:10, set:{slew:250}},
  {g:2, name:"伸桿並調整仰角到卸放半徑",     dur:8,  set:{tele:0.7, luff:58}, hookY:10},
  {g:2, name:"降勾，吊物就位",               dur:7,  set:{}, hookY:C.platH+restHook, release:true},
  {g:3, name:"卸勾，收勾",                   dur:5,  set:{}, hookY:14},
  {g:3, name:"收回伸縮桿",                   dur:6,  set:{tele:0, rope:4}},
  {g:3, name:"上部旋轉回正",                 dur:7,  set:{slew:360}},
  {g:3, name:"伏下吊桿，固定勾頭",           dur:7,  set:{luff:0, rope:C.ropeMin}},
  {g:3, name:"收回垂直駐腳",                 dur:5,  set:{outV:0}},
  {g:3, name:"收回水平駐腳，作業結束",       dur:5,  set:{outH:0}}
];
var KEYS = ["outH","outV","slew","luff","tele","rope"];
var total = 0, tAttach = 0, tRelease = 0, pick, place;
(function build(){
  var cur = {outH:0,outV:0,slew:0,luff:0,tele:0,rope:C.ropeMin};
  steps.forEach(function(st){
    var n = Object.assign({}, cur, st.set);
    var f = fk(n);
    if (st.hookY != null) n.rope = f.hy - st.hookY;
    st.t0 = total; total += st.dur; st.t1 = total;
    st.from = cur; st.to = n; cur = n;
    if (st.attach)  { tAttach = st.t1;  pick  = {x:f.hx, y:st.hookY, z:f.hz}; }
    if (st.release) { tRelease = st.t1; place = {x:f.hx, y:st.hookY, z:f.hz}; }
  });
})();
function stepIndexAt(t){
  for (var i=0;i<steps.length;i++) if (t < steps[i].t1) return i;
  return steps.length-1;
}
function stateAt(t){
  var st = steps[stepIndexAt(t)];
  var u = Math.min(1, Math.max(0, (t - st.t0)/st.dur));
  u = u*u*(3-2*u);
  var s = {};
  KEYS.forEach(function(k){ s[k] = st.from[k] + (st.to[k]-st.from[k])*u; });
  return s;
}

/* ---------- three.js scene ---------- */
var canvas = $("gl"), stage = $("stage");
var renderer = new THREE.WebGLRenderer({canvas:canvas, antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
var scene = new THREE.Scene();
scene.background = new THREE.Color(0xd9e2e7);
scene.fog = new THREE.Fog(0xd9e2e7, 90, 220);
var camera = new THREE.PerspectiveCamera(42, 1, 0.5, 400);
var controls = new THREE.OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI/2 - 0.03;
controls.minDistance = 12; controls.maxDistance = 120;
function resetView(){
  var k = Math.max(1, 1.15/Math.max(0.5, camera.aspect));
  camera.position.set(30*k, 20*k, 34*k);
  controls.target.set(-2, 8, 0);
  controls.update();
}

scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8f86, 0.75));
var sun = new THREE.DirectionalLight(0xfff4dd, 0.95);
sun.position.set(30, 55, 25); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
var sc = sun.shadow.camera; sc.left=-40; sc.right=40; sc.top=40; sc.bottom=-40; sc.near=1; sc.far=150;
sun.shadow.bias = -0.0005;
scene.add(sun);

function mat(color, rough, metal){ return new THREE.MeshStandardMaterial({color:color, roughness:rough==null?0.7:rough, metalness:metal||0}); }
var M = {
  yellow: mat(0xf2b705, 0.55, 0.1), yellowDk: mat(0xd49c00, 0.6, 0.1),
  dark: mat(0x2a2f35, 0.7, 0.2), black: mat(0x15171a, 0.9),
  steel: mat(0xb9c0c6, 0.35, 0.7), glass: mat(0x5d7f95, 0.2, 0.3),
  grey: mat(0x7c858c, 0.8), concrete: mat(0xb8b5ad, 0.95),
  load: mat(0x9d4f3a, 0.85), ground: mat(0xaab0a6, 1),
  red: mat(0xd9482b, 0.6)
};
function box(w,h,d,m,x,y,z,parent){
  var o = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), m);
  o.position.set(x,y,z); o.castShadow = true; o.receiveShadow = true;
  (parent||scene).add(o); return o;
}
function cyl(r,h,m,x,y,z,parent,seg){
  var o = new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,seg||24), m);
  o.position.set(x,y,z); o.castShadow = true; o.receiveShadow = true;
  (parent||scene).add(o); return o;
}

/* ground */
var ground = new THREE.Mesh(new THREE.PlaneGeometry(400,400), M.ground);
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);
var grid = new THREE.GridHelper(120, 60, 0x8d948b, 0x9ba197);
grid.position.y = 0.01; grid.material.transparent = true; grid.material.opacity = 0.55; scene.add(grid);

/* pick zone marking + landing platform */
(function site(){
  var edge = new THREE.Mesh(new THREE.RingGeometry(2.3, 2.5, 4, 1), new THREE.MeshBasicMaterial({color:0xf2b705}));
  edge.rotation.x = -Math.PI/2; edge.rotation.z = Math.PI/4;
  edge.position.set(pick.x, 0.03, pick.z); scene.add(edge);
  box(2.2,0.12,0.25,M.grey, pick.x, 0.06, pick.z-0.35);   // dunnage
  box(2.2,0.12,0.25,M.grey, pick.x, 0.06, pick.z+0.35);
  var pw = 6.4, pd = 5.2, H = C.platH;
  box(pw,0.4,pd,M.concrete, place.x, H-0.2, place.z);
  [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(function(c){
    box(0.45, H-0.4, 0.45, M.concrete, place.x + c[0]*(pw/2-0.4), (H-0.4)/2, place.z + c[1]*(pd/2-0.4));
  });
  // traffic cones around the working area
  [[9,6],[9,-6],[-12,-6],[2,-15],[-14,8],[4,9]].forEach(function(p){
    var cone = new THREE.Mesh(new THREE.ConeGeometry(0.22,0.7,12), M.red);
    cone.position.set(p[0],0.35,p[1]); cone.castShadow = true; scene.add(cone);
  });
})();

/* carrier */
var carrier = new THREE.Group(); scene.add(carrier);
box(12.2,0.9,2.5,M.yellow, -0.1,1.15,0, carrier);
box(12.4,0.25,2.3,M.dark, -0.1,0.75,0, carrier);
box(1.9,1.45,2.5,M.yellow, 5.1,1.6,0, carrier);                 // driving cab
box(0.06,0.7,2.2,M.glass, 6.06,1.85,0, carrier);
box(1.2,0.6,0.06,M.glass, 5.2,1.9,1.26, carrier);
box(1.2,0.6,0.06,M.glass, 5.2,1.9,-1.26, carrier);
[4.4,2.9,-2.9,-4.4].forEach(function(x){
  [1.15,-1.15].forEach(function(z){
    var w = cyl(0.6,0.45,M.black,x,0.6,z,carrier,28); w.rotation.x = Math.PI/2;
    var h = cyl(0.25,0.47,M.steel,x,0.6,z,carrier,16); h.rotation.x = Math.PI/2;
  });
});
/* outriggers: horizontal beam slides out, jack cylinder extends down */
var outriggers = [];
[1.5,-5.7].forEach(function(x){
  box(0.75,0.5,2.5,M.dark, x,0.95,0, carrier);                  // beam box
  [1,-1].forEach(function(side){
    var beam = new THREE.Group(); beam.position.set(x + side*0.17, 0.95, 0); carrier.add(beam);
    box(0.28,0.3,2.5,M.yellowDk, 0,0,0, beam);
    box(0.36,0.75,0.36,M.dark, 0,0.12,side*1.1, beam);          // jack housing
    var rod = new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.09,1,16).translate(0,-0.5,0), M.steel);
    rod.position.set(0,0,side*1.1); rod.castShadow = true; beam.add(rod);
    var pad = cyl(0.36,0.08,M.dark, 0,0,side*1.1, beam);
    outriggers.push({beam:beam, rod:rod, pad:pad, side:side});
  });
});

/* upper structure (slews) */
var upper = new THREE.Group(); upper.position.set(C.cx, C.deckY, 0); carrier.add(upper);
cyl(1.15,0.3,M.dark, 0,0.15,0, upper,36);
box(5.2,0.5,2.4,M.yellow, -1.0,0.55,0, upper);
box(1.3,1.3,2.6,M.dark, -3.5,1.05,0, upper);                    // counterweight
box(1.6,1.55,0.85,M.yellow, 0.9,1.55,0.95, upper);              // operator cab
box(0.06,0.9,0.7,M.glass, 1.72,1.75,0.95, upper);
box(1.2,0.8,0.06,M.glass, 0.95,1.8,1.39, upper);
box(0.5,1.1,0.12,M.yellowDk, C.px,0.95,0.52, upper);            // boom foot brackets
box(0.5,1.1,0.12,M.yellowDk, C.px,0.95,-0.52, upper);
box(1.3,0.7,0.9,M.dark, -2.4,1.15,0, upper);                    // winch
var winch = cyl(0.33,0.8,M.steel, -2.4,1.6,0, upper,20); winch.rotation.x = Math.PI/2;

/* boom */
var boomG = new THREE.Group(); boomG.position.set(C.px, C.py, 0); upper.add(boomG);
box(C.L0,0.9,0.8,M.yellow, C.L0/2,0,0, boomG);
var sections = [];
[[0.76,0.66],[0.62,0.54],[0.48,0.42]].forEach(function(d,i){
  var g = new THREE.Group(); boomG.add(g);
  box(C.secLen,d[0],d[1], i%2 ? M.yellow : M.yellowDk, C.L0 - C.secLen/2, 0, 0, g);
  sections.push(g);
});
(function head(){
  var g = sections[2];
  box(0.7,0.75,0.5,M.dark, C.L0+0.1,-0.15,0, g);
  var s = cyl(0.22,0.3,M.steel, C.L0+C.headX-0.02, C.headY+0.18, 0, g, 20); s.rotation.x = Math.PI/2;
})();
/* luffing cylinder */
var cylA = new THREE.Vector3(0.6,0.7,0);
var luffBarrel = new THREE.Mesh(new THREE.CylinderGeometry(0.17,0.17,1,16).translate(0,0.5,0), M.dark);
var luffRod = new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.09,1,16).translate(0,0.5,0), M.steel);
[luffBarrel,luffRod].forEach(function(o){ o.position.copy(cylA); o.castShadow = true; upper.add(o); });

/* rope, hook block, load, slings */
var rope = new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.035,1,8).translate(0,-0.5,0), M.black);
scene.add(rope);
var hookG = new THREE.Group(); scene.add(hookG);
box(0.55,0.6,0.35,M.yellow, 0,0.9,0, hookG);
box(0.57,0.12,0.37,M.black, 0,0.9,0, hookG);
cyl(0.06,0.3,M.steel, 0,0.47,0, hookG,12);
(function(){
  var t = new THREE.Mesh(new THREE.TorusGeometry(0.2,0.06,10,24,Math.PI*1.5), M.steel);
  t.position.set(0,0.22,0); t.rotation.z = Math.PI*0.75; t.castShadow = true; hookG.add(t);
})();
var load = new THREE.Group(); scene.add(load);
box(C.loadW,C.loadH,C.loadD,M.load, 0,0,0, load);
box(C.loadW+0.02,0.12,C.loadD+0.02,M.dark, 0,0.25,0, load);
box(C.loadW+0.02,0.12,C.loadD+0.02,M.dark, 0,-0.25,0, load);
var slingGeo = new THREE.BufferGeometry();
slingGeo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(24), 3));
var slings = new THREE.LineSegments(slingGeo, new THREE.LineBasicMaterial({color:0x22262a}));
slings.frustumCulled = false; scene.add(slings);

/* working-radius ring on the ground */
var ring = new THREE.Mesh(new THREE.RingGeometry(0.992,1,160), new THREE.MeshBasicMaterial({color:0x2b6c8f, transparent:true, opacity:0.75, side:THREE.DoubleSide}));
ring.rotation.x = -Math.PI/2; scene.add(ring);

/* ---------- state + apply ---------- */
var state = stateAt(0), time = 0, playing = false, manual = false;
var UP = new THREE.Vector3(0,1,0), tmp = new THREE.Vector3();
var last = {};

function apply(){
  var s = state, f = fk(s), a = s.luff*D2R;
  carrier.position.y = f.lift;
  var jackExt = s.outV*C.jackStroke;
  outriggers.forEach(function(o){
    o.beam.position.z = o.side*s.outH*C.beamTravel;
    var len = 0.4 + jackExt;
    o.rod.scale.y = len; o.pad.position.y = -len + 0.04;
  });
  upper.rotation.y = s.slew*D2R;
  boomG.rotation.z = a;
  var stepX = C.secStep + C.ext*s.tele;
  sections.forEach(function(g,i){ g.position.x = (i+1)*stepX; });

  var bx = C.px + 5.5*Math.cos(a) + 0.45*Math.sin(a), by = C.py + 5.5*Math.sin(a) - 0.45*Math.cos(a);
  tmp.set(bx - cylA.x, by - cylA.y, 0);
  var cl = tmp.length(); tmp.normalize();
  luffBarrel.quaternion.setFromUnitVectors(UP, tmp); luffRod.quaternion.copy(luffBarrel.quaternion);
  luffBarrel.scale.y = Math.min(3.1, cl*0.96); luffRod.scale.y = cl;

  var attached = time >= tAttach && time < tRelease;
  var minHook = attached ? restHook : 0.25;
  var hookY = Math.min(f.hy - C.ropeMin, Math.max(minHook, f.hy - s.rope));
  rope.position.set(f.hx, f.hy, f.hz);
  rope.scale.y = Math.max(0.01, f.hy - (hookY + 1.2));
  hookG.position.set(f.hx, hookY, f.hz);

  var lp = attached ? {x:f.hx, y:hookY, z:f.hz} : (time < tAttach ? pick : place);
  var topY = lp.y - C.slingH;
  load.position.set(lp.x, topY - C.loadH/2, lp.z);
  slings.visible = attached;
  if (attached){
    var p = slingGeo.attributes.position.array, i = 0;
    [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(function(c){
      p[i++]=f.hx; p[i++]=hookY+0.12; p[i++]=f.hz;
      p[i++]=lp.x + c[0]*(C.loadW/2-0.15); p[i++]=topY; p[i++]=lp.z + c[1]*(C.loadD/2-0.1);
    });
    slingGeo.attributes.position.needsUpdate = true;
  }
  var r = Math.max(0.5, Math.abs(f.radius));
  ring.scale.set(r, r, 1); ring.position.set(C.cx, 0.025, 0);

  last = {f:f, hookY:hookY, attached:attached, jackExt:jackExt};
  updateUI();
}

/* ---------- UI ---------- */
var sliders = {outH:$("sOutH"), outV:$("sOutV"), slew:$("sSlew"), luff:$("sLuff"), tele:$("sTele"), rope:$("sRope")};
var outs = {outH:$("oOutH"), outV:$("oOutV"), slew:$("oSlew"), luff:$("oLuff"), tele:$("oTele"), rope:$("oRope")};
var tl = $("timeline"); tl.max = total;
var segEls = [], stepBtns = [], lastStep = -1;

(function buildUI(){
  var segs = $("segs"), list = $("stepList"), groups = $("groups"), gDur = [0,0,0,0], gPrev = -1;
  steps.forEach(function(st,i){
    var e = document.createElement("i");
    e.style.flex = st.dur + " 0 0"; e.style.background = GROUPS[st.g].color;
    segs.appendChild(e); segEls.push(e); gDur[st.g] += st.dur;
    if (st.g !== gPrev){
      var h = document.createElement("li"); h.className = "grp";
      var sw = document.createElement("i"); sw.style.background = GROUPS[st.g].color;
      h.appendChild(sw); h.appendChild(document.createTextNode(GROUPS[st.g].name));
      list.appendChild(h); gPrev = st.g;
    }
    var li = document.createElement("li"), b = document.createElement("button"), n = document.createElement("span");
    b.type = "button"; n.textContent = i+1; b.appendChild(n); b.appendChild(document.createTextNode(st.name));
    b.addEventListener("click", function(){ seek(st.t0 + 0.001); setPlaying(true); });
    li.appendChild(b); list.appendChild(li); stepBtns.push(b);
  });
  GROUPS.forEach(function(g,i){
    var s = document.createElement("span");
    s.style.flex = gDur[i] + " 0 0"; s.style.borderColor = g.color; s.textContent = g.name;
    groups.appendChild(s);
  });
})();

function fmt(v,d){ return v.toFixed(d==null?1:d); }
function updateUI(){
  var s = state, f = last.f;
  KEYS.forEach(function(k){ if (document.activeElement !== sliders[k]) sliders[k].value = s[k]; });
  outs.outH.textContent = Math.round(s.outH*100) + " %";
  outs.outV.textContent = Math.round(s.outV*100) + " %";
  outs.slew.textContent = fmt(s.slew % 360 === 0 && s.slew > 0 ? 360 : s.slew, 0) + "°";
  outs.luff.textContent = fmt(s.luff) + "°";
  outs.tele.textContent = fmt(f.L) + " m";
  outs.rope.textContent = fmt(f.hy - last.hookY) + " m";
  $("rLen").textContent = fmt(f.L); $("rLuff").textContent = fmt(s.luff);
  $("rRad").textContent = fmt(Math.abs(f.radius)); $("rSlew").textContent = fmt(s.slew % 360, 0);
  $("rHook").textContent = fmt(last.hookY);

  var co = $("chipOut"), grounded = last.jackExt >= C.jackGap - 0.001, ready = s.outH > 0.99 && s.outV > 0.99;
  co.className = "chip" + (ready ? " ok" : (s.outH > 0.01 || s.outV > 0.01 ? " on" : ""));
  co.textContent = ready ? "駐腳全伸，車身頂升 " + Math.round(f.lift*100) + " cm"
    : grounded ? "駐腳著地，頂升 " + Math.round(f.lift*100) + " cm"
    : s.outV > 0.01 ? "駐腳垂直伸出 " + Math.round(s.outV*100) + " %"
    : s.outH > 0.01 ? "駐腳水平外伸 " + Math.round(s.outH*100) + " %" : "駐腳未伸出";
  var cl = $("chipLoad");
  cl.className = "chip" + (last.attached ? " on" : (time >= tRelease ? " ok" : ""));
  cl.textContent = last.attached ? "吊掛中" : (time >= tRelease ? "吊物已卸放" : "吊物未掛勾");
  $("chipManual").hidden = !manual;
  var working = s.luff > 3 || s.tele > 0.02 || (s.slew % 360 > 2 && s.slew % 360 < 358);
  $("chipWarn").hidden = !(working && !ready);

  var i = stepIndexAt(time);
  if (i !== lastStep){
    lastStep = i;
    $("stepNo").textContent = "步驟 " + (i+1) + " / " + steps.length + "　" + GROUPS[steps[i].g].name;
    $("stepName").textContent = steps[i].name;
    segEls.forEach(function(e,j){ e.className = j < i ? "done" : (j === i ? "cur" : ""); });
    stepBtns.forEach(function(b,j){ if (j === i) b.setAttribute("aria-current","step"); else b.removeAttribute("aria-current"); });
  }
  if (document.activeElement !== tl || playing) tl.value = time;
  $("time").textContent = fmt(time) + " / " + fmt(total) + " s";
}
function setPlaying(p){
  playing = p; $("play").textContent = p ? "暫停" : "播放";
  if (p) manual = false;
}
function seek(t){
  time = Math.min(total, Math.max(0, t)); manual = false;
  state = stateAt(time); apply();
}
KEYS.forEach(function(k){
  sliders[k].addEventListener("input", function(){
    setPlaying(false); manual = true;
    state[k] = parseFloat(sliders[k].value); apply();
  });
});
tl.addEventListener("input", function(){ setPlaying(false); seek(parseFloat(tl.value)); });
$("play").addEventListener("click", function(){
  if (!playing){
    if (time >= total - 0.01) time = 0;
    state = stateAt(time);
  }
  setPlaying(!playing); apply();
});
$("prev").addEventListener("click", function(){
  var i = stepIndexAt(time); setPlaying(false);
  seek(time - steps[i].t0 > 0.3 ? steps[i].t0 : steps[Math.max(0,i-1)].t0);
});
$("next").addEventListener("click", function(){
  var i = stepIndexAt(time); setPlaying(false);
  seek(i < steps.length-1 ? steps[i+1].t0 : total);
});
$("resetView").addEventListener("click", resetView);

/* ---------- loop ---------- */
function resize(){
  var w = stage.clientWidth, h = stage.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  camera.aspect = w/h; camera.updateProjectionMatrix();
}
if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
window.addEventListener("resize", resize);
resize(); resetView(); apply();

var prevT = performance.now();
function frame(now){
  var dt = Math.min(0.1, (now - prevT)/1000); prevT = now;
  if (playing){
    time += dt*parseFloat($("speed").value);
    if (time >= total){ time = total; setPlaying(false); }
    state = stateAt(time); apply();
  }
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
if (!reduce) setPlaying(true);
})();
</script>
</body>
</html>
