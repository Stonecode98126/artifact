<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>越野式起重機吊掛流程</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: 3D stage fills the left, slate control column on the right, full-width timeline along the bottom. Single theme by choice. */
:root{
  color-scheme: dark;
  --sky:#d9e2e7;
  --panel:#1b252e;
  --panel-2:#243240;
  --line:#35475a;
  --ink:#e8eef2;
  --muted:#93a4b3;
  --accent:#f2b705;      /* crane yellow */
  --warn:#ff7a59;
  --ok:#57c794;
  --g0:#5b7fa6; --g1:#3f9c9a; --g2:#c9962a; --g3:#8a78b8;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Hiragino Sans","Yu Gothic","Malgun Gothic","Microsoft YaHei",system-ui,sans-serif;
  --font-num:"Barlow Condensed","Noto Sans TC",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--panel);color:var(--ink);
  font-family:var(--font-body);font-size:14px;line-height:1.5;
  display:flex;flex-direction:column;overflow:hidden;
}
.top{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--line)}
.top h1{font-size:15px;font-weight:700;margin:0}
#lang{margin-left:auto}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;max-width:100%}
.seg button{
  font:inherit;font-weight:700;color:var(--ink);background:var(--panel-2);border:0;border-right:1px solid var(--line);
  padding:5px 14px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;line-height:1.25;min-width:0;
}
.seg button:last-child{border-right:0}
.seg button small{font-weight:400;font-size:11.5px;color:var(--muted)}
.seg button:hover{background:var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#1b1a12}
.seg button[aria-pressed="true"] small{color:#4a3d0a}
.seg button:focus-visible{outline-offset:-3px}
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 340px}
.stage{position:relative;min-height:0;background:var(--sky);overflow:hidden}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

.hud{
  position:absolute;left:16px;top:16px;right:16px;pointer-events:none;
  display:flex;flex-direction:column;gap:10px;align-items:flex-start;
}
.stepcard{
  background:rgba(27,37,46,.92);border-left:4px solid var(--accent);
  padding:8px 14px 9px;border-radius:2px;max-width:min(460px,100%);
}
.stepcard .eyebrow{font-family:var(--font-num);font-size:14px;letter-spacing:.06em;color:var(--muted)}
.stepcard .name{font-size:17px;font-weight:700;text-wrap:balance}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  background:rgba(27,37,46,.88);padding:3px 10px;border-radius:999px;font-size:12.5px;
  display:flex;align-items:center;gap:6px;
}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.chip.ok::before{background:var(--ok)}
.chip.on::before{background:var(--accent)}
.chip.warn{color:#ffd9cf}.chip.warn::before{background:var(--warn)}
.chip[hidden]{display:none}

.readout{
  position:absolute;left:16px;bottom:14px;pointer-events:none;
  display:grid;grid-template-columns:repeat(5,auto);gap:2px 18px;
  background:rgba(27,37,46,.9);padding:8px 14px;border-radius:2px;
}
.readout div{display:flex;flex-direction:column}
.readout dt{font-size:11.5px;color:var(--muted)}
.readout dd{margin:0;font-family:var(--font-num);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.readout dd small{font-size:13px;color:var(--muted);font-weight:500;margin-left:2px}
.viewbtn{position:absolute;right:16px;bottom:14px}

.panel{
  background:var(--panel);border-left:1px solid var(--line);
  overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:18px;min-height:0;
}
.panel h2{font-size:12.5px;font-weight:500;color:var(--muted);margin:0 0 8px;letter-spacing:.08em}
.ctl{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:baseline;margin-bottom:11px}
.ctl label{font-weight:500}
.ctl output{font-family:var(--font-num);font-size:17px;font-variant-numeric:tabular-nums;color:var(--accent)}
.ctl input{grid-column:1/-1;width:100%;margin:2px 0 0;accent-color:var(--accent);height:22px;cursor:pointer}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.steps .grp{font-size:12px;color:var(--muted);margin:8px 0 2px;display:flex;align-items:center;gap:6px}
.steps .grp i{width:10px;height:10px;border-radius:2px;display:inline-block}
.steps button{
  width:100%;text-align:left;background:none;border:0;color:var(--ink);font:inherit;
  padding:5px 8px;border-radius:3px;cursor:pointer;display:flex;gap:8px;
}
.steps button span{font-family:var(--font-num);color:var(--muted);min-width:18px;font-variant-numeric:tabular-nums}
.steps button:hover{background:var(--panel-2)}
.steps button[aria-current="step"]{background:var(--panel-2);box-shadow:inset 3px 0 0 var(--accent)}
.note{font-size:12px;color:var(--muted);margin:0}
.note a{color:var(--accent)}

.bar{
  border-top:1px solid var(--line);background:var(--panel);
  padding:10px 16px 12px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 14px;align-items:center;
}
.btns{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
button.b,select.b{
  font:inherit;color:var(--ink);background:var(--panel-2);border:1px solid var(--line);
  padding:6px 12px;border-radius:4px;cursor:pointer;
}
button.b:hover,select.b:hover{border-color:var(--muted)}
button.b.primary{background:var(--accent);color:#1b1a12;border-color:var(--accent);font-weight:700;min-width:72px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tl{min-width:0}
.track{position:relative;height:30px}
.segs{position:absolute;inset:6px 0;display:flex;gap:2px}
.segs i{display:block;height:100%;opacity:.45;border-radius:1px}
.segs i.done{opacity:.95}
.segs i.cur{opacity:1;outline:1px solid var(--ink)}
.track input{
  position:absolute;inset:0;width:100%;height:100%;margin:0;background:none;
  -webkit-appearance:none;appearance:none;cursor:ew-resize;
}
.track input::-webkit-slider-runnable-track{background:none;height:30px}
.track input::-moz-range-track{background:none;height:30px}
.track input::-webkit-slider-thumb{-webkit-appearance:none;width:6px;height:30px;background:var(--ink);border-radius:2px;box-shadow:0 0 0 2px var(--panel)}
.track input::-moz-range-thumb{width:6px;height:30px;background:var(--ink);border:0;border-radius:2px;box-shadow:0 0 0 2px var(--panel)}
.groups{display:flex;gap:2px;margin-top:3px;font-size:12px;color:var(--muted)}
.groups span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border-top:2px solid;padding-top:2px}
.time{font-family:var(--font-num);font-size:16px;font-variant-numeric:tabular-nums;color:var(--muted);min-width:92px}

@media (max-width:820px){
  .main{grid-template-columns:1fr;grid-template-rows:46% minmax(0,1fr)}
  .panel{border-left:0;border-top:1px solid var(--line)}
  .readout{grid-template-columns:repeat(3,auto);gap:2px 12px;padding:6px 10px}
  .readout dd{font-size:18px}
  .readout .opt{display:none}
  .viewbtn{bottom:auto;top:16px}
  .hud{right:96px}
  .stepcard .name{font-size:15px}
  .bar{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header class="top">
  <h1 data-i18n="title">吊掛作業流程</h1>
  <div class="seg" id="models" role="group" aria-label="車型"></div>
  <select class="b" id="lang" aria-label="Language"></select>
</header>
<div class="main">
  <div class="stage" id="stage">
    <canvas id="gl" aria-label="伸縮桿起重機 3D 場景，可拖曳旋轉視角"></canvas>
    <div class="hud">
      <div class="stepcard">
        <div class="eyebrow" id="stepNo">步驟 1 / 19</div>
        <div class="name" id="stepName">車輛就位</div>
      </div>
      <div class="chips">
        <span class="chip" id="chipOut">駐腳未伸出</span>
        <span class="chip" id="chipLoad">吊物未掛勾</span>
        <span class="chip" id="chipSig">指揮手：待命</span>
        <span class="chip on" id="chipManual" data-i18n="manual" hidden></span>
        <span class="chip warn" id="chipWarn" data-i18n="warn" hidden></span>
      </div>
    </div>
    <dl class="readout">
      <div><dt data-i18n="rLen">桿長</dt><dd><span id="rLen">0</span><small>m</small></dd></div>
      <div><dt data-i18n="rLuff">仰角</dt><dd><span id="rLuff">0</span><small>°</small></dd></div>
      <div><dt data-i18n="rRad">作業半徑</dt><dd><span id="rRad">0</span><small>m</small></dd></div>
      <div class="opt"><dt data-i18n="rSlew">旋轉角</dt><dd><span id="rSlew">0</span><small>°</small></dd></div>
      <div class="opt"><dt data-i18n="rHook">勾頭高度</dt><dd><span id="rHook">0</span><small>m</small></dd></div>
    </dl>
    <button class="b viewbtn" id="resetView" type="button" data-i18n="resetView">重設視角</button>
  </div>

  <aside class="panel">
    <section>
      <h2 data-i18n="hOut">駐腳</h2>
      <div class="ctl"><label for="sOutH" data-i18n="lOutH">水平外伸（全車四支）</label><output id="oOutH"></output>
        <input id="sOutH" type="range" min="0" max="1" step="0.01"></div>
      <div class="ctl"><label for="sOutV" data-i18n="lOutV">垂直伸出（全車四支）</label><output id="oOutV"></output>
        <input id="sOutV" type="range" min="0" max="1" step="0.01"></div>
    </section>
    <section>
      <h2 data-i18n="hUpper">上部機構</h2>
      <div class="ctl"><label for="sSlew" data-i18n="lSlew">上部旋轉</label><output id="oSlew"></output>
        <input id="sSlew" type="range" min="0" max="360" step="0.5"></div>
      <div class="ctl"><label for="sLuff" data-i18n="lLuff">仰傾角</label><output id="oLuff"></output>
        <input id="sLuff" type="range" min="0" max="82" step="0.5"></div>
      <div class="ctl"><label for="sTele" data-i18n="lTele">伸縮桿</label><output id="oTele"></output>
        <input id="sTele" type="range" min="0" max="1" step="0.005"></div>
      <div class="ctl"><label for="sRope" data-i18n="lRope">勾頭上下（鋼索放出）</label><output id="oRope"></output>
        <input id="sRope" type="range" min="1.3" max="27" step="0.05"></div>
    </section>
    <section>
      <h2 data-i18n="hFlow">作業流程</h2>
      <ol class="steps" id="stepList"></ol>
    </section>
    <p class="note" id="note"></p>
    <p class="note"><span data-i18n="contact">聯絡信箱</span>：<a href="mailto:owen163@gmail.com">owen163@gmail.com</a></p>
  </aside>
</div>

<div class="bar">
  <div class="btns">
    <button class="b primary" id="play" type="button">播放</button>
    <button class="b" id="prev" type="button" data-i18n="prev">上一步</button>
    <button class="b" id="next" type="button" data-i18n="next">下一步</button>
    <select class="b" id="speed" aria-label="播放速度">
      <option value="0.5">0.5×</option><option value="1">1×</option>
      <option value="2" selected>2×</option><option value="4">4×</option>
    </select>
    <span class="time" id="time">0.0 / 0.0 s</span>
  </div>
  <div class="tl">
    <div class="track">
      <div class="segs" id="segs"></div>
      <input id="timeline" type="range" min="0" max="100" step="0.01" value="0" aria-label="流程時間軸">
    </div>
    <div class="groups" id="groups"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
"use strict";
var D2R = Math.PI/180;
var $ = function(id){ return document.getElementById(id); };

/* ---------- crane models (metres) ---------- */
var RT_BASE = {
  type:"rt",
  cx:-0.3, deckY:1.46,         // slewing centre on carrier
  px:-1.7, py:1.35, pz:-0.3,   // boom foot pin, in upper-structure frame
  Lmin:6.5, ext:21, nSec:5, secLen:6.1, nose:0.07,
  headX:0.15, headY:-0.3,      // rope drop point relative to boom tip
  slingH:1.1, loadW:1.6, loadH:0.7, loadD:0.9, strapY:0.17,
  ropeMin:1.3, ropeMax:27, hookTop:0.96, hookScale:0.8,
  jackStroke:0.73, jackGap:0.55, platH:4,
  cylA:[-0.4,0.3], cylAtt:[3.4,-0.3], barrelMax:2.15,
  cones:[[6,5],[6,-5],[-7,-5],[2,-10.5],[-8.5,5],[3.5,6]],
  cam:[21,14,24], target:[-1,5.5,0], signal:[10.5,2.5], mail:[6.5,9.5,9],
  flow:{luffUp:55, ropeUp:2.5, telePick:0.4, hoistY:7.0, telePlace:0.6, luffPlace:58, travelY:7.4, clearY:10}
};
var MODELS = [
  Object.assign({}, RT_BASE, {
    id:"gr160n", label:"GR-160N", sub:"越野式 16 t",
    luffMax:82.5, cylZ:[0], cylR:0.13, teleMode:"seq", jib:3.8,
    jackZ:0.895, beamTravel:1.705,       // jack centres 1.79 m to 5.2 m
    note:"依 GR-160N 公開規格建模：6 段桿 6.5–27.5 m（2、3 節同步，4、5、6 節同步）、仰角上限 82.5°、H 型駐腳張出幅 1.79–5.2 m、單支起伏油壓缸。軸距與車身外形為估計值，兩組桿節的先後順序為假設，未內建額定荷重表。"
  }),
  Object.assign({}, RT_BASE, {
    id:"tr160m", label:"TR-160M", sub:"越野式 16 t",
    luffMax:82, cylZ:[0.2,-0.2], cylR:0.1, teleMode:"sync", jib:3.5,
    jackZ:0.8, beamTravel:1.8,           // 5.2 m fully extended
    note:"依 TR-160M 公開規格建模：6 段桿 6.5–27.5 m、仰角上限 82°、H 型駐腳最大張出幅 5.2 m、雙起伏油壓缸。軸距、車身外形與收回時的駐腳寬度為估計值，桿節以同步伸出表示，未內建額定荷重表。"
  }),
  {
    id:"truck", label:"卡車式", sub:"四軸通用示意", type:"truck",
    cx:-1.5, deckY:1.6, px:-1.6, py:1.3, pz:0,
    Lmin:11.55, ext:23.4, nSec:3, secLen:10.2, nose:0.35,
    headX:0.2, headY:-0.4,
    slingH:1.4, loadW:2.4, loadH:1.0, loadD:1.2, strapY:0.25,
    ropeMin:1.6, ropeMax:34, hookTop:1.2, hookScale:1,
    jackZ:1.1, beamTravel:2.4, jackStroke:0.73, jackGap:0.55, platH:5,
    luffMax:80, cylA:[0.6,0.7], cylAtt:[5.5,-0.45], barrelMax:3.1, cylZ:[0], cylR:0.17, teleMode:"sync",
    cones:[[9,6],[9,-6],[-12,-6],[2,-15],[-14,8],[4,9]],
    cam:[30,20,34], target:[-2,8,0], signal:[15.5,3], mail:[9,14,13],
    flow:{luffUp:50, ropeUp:4, telePick:0.3, hoistY:9.6, telePlace:0.7, luffPlace:58, travelY:10, clearY:14},
    note:"通用四軸卡車式伸縮桿吊車示意，尺寸與動作不對應特定機型，未內建額定荷重表。"
  }
];
var C = MODELS[0];

function liftOf(outV){ return Math.max(0, outV*C.jackStroke - C.jackGap); }
function boomLen(tele){ return C.Lmin + C.ext*tele; }
function secExt(tele){
  var e = C.ext*tele, n = C.nSec, out = [], i;
  if (C.teleMode === "seq"){              // sections 2-3 together, then 4-5-6 together
    var first = Math.min(e, C.ext*2/n), rest = e - first;
    for (i=0;i<n;i++) out.push(i < 2 ? first/2 : rest/(n-2));
  } else for (i=0;i<n;i++) out.push(e/n);
  return out;
}
function fk(s){
  var a = s.luff*D2R, th = s.slew*D2R, L = boomLen(s.tele);
  var hx = L + C.headX, hy = C.headY;
  var x = C.px + hx*Math.cos(a) - hy*Math.sin(a);
  var y = C.py + hx*Math.sin(a) + hy*Math.cos(a);
  var lift = liftOf(s.outV);
  return { L:L, radius:Math.hypot(x, C.pz), lift:lift,
    hx: C.cx + x*Math.cos(th) + C.pz*Math.sin(th), hy: C.deckY + lift + y,
    hz: -x*Math.sin(th) + C.pz*Math.cos(th) };
}

  ui:{title:"吊掛作業流程", contact:"聯絡信箱", model:"車型", lang:"語言", scene:"伸縮桿起重機 3D 場景，可拖曳旋轉視角", step:"步驟 {0} / {1}　{2}",
    manual:"手動調整中，拖時間軸可回到流程", warn:"駐腳未完全伸出並頂升，不得起吊",
    rLen:"桿長", rLuff:"仰角", rRad:"作業半徑", rSlew:"旋轉角", rHook:"勾頭高度", resetView:"重設視角",
    hOut:"駐腳", hUpper:"上部機構", hFlow:"作業流程",
    lOutH:"水平外伸（全車四支）", lOutV:"垂直伸出（全車四支）", lSlew:"上部旋轉", lLuff:"仰傾角", lTele:"伸縮桿", lRope:"勾頭上下（鋼索放出）",
    play:"播放", pause:"暫停", prev:"上一步", next:"下一步", speed:"播放速度", timeline:"流程時間軸",
    span:"張出幅 {0} m", outNone:"駐腳未伸出", outH:"駐腳水平外伸 {0} %", outV:"駐腳垂直伸出 {0} %", outGround:"駐腳著地，頂升 {0} cm", outReady:"駐腳全伸，車身頂升 {0} cm",
    loadNone:"吊物未掛勾", loadOn:"吊掛中", loadDone:"吊物已卸放",
    sigPrefix:"指揮手：{0}", sig_idle:"待命", sig_out:"駐腳作業，監看", sig_stop:"停止", sig_slew:"旋轉（手指迴轉方向）", sig_hoistUp:"吊升", sig_hoistDown:"下降", sig_luffUp:"仰桿", sig_luffDown:"伏桿", sig_teleOut:"伸桿", sig_teleIn:"縮桿",

    var n = Object.assign({}, cur, st.set);
    var f = fk(n);
    if (st.hookY != null) n.rope = f.hy - st.hookY;
    st.t0 = total; total += st.dur; st.t1 = total;
    st.from = cur; st.to = n; cur = n;

function stepIndexAt(t){
  for (var i=0;i<steps.length;i++) if (t < steps[i].t1) return i;

}
function stateAt(t){
  var st = steps[stepIndexAt(t)];
  var u = Math.min(1, Math.max(0, (t - st.t0)/st.dur));
  u = u*u*(3-2*u);
  var s = {};
  KEYS.forEach(function(k){ s[k] = st.from[k] + (st.to[k]-st.from[k])*u; });
  return s;
}

function noteMotion(s, hookY){
  if (prevS){
    var dS = s.slew - prevS.slew, dT = (s.tele - prevS.tele)*C.ext, dL = s.luff - prevS.luff, dH = hookY - prevS.hookY;
    var dO = Math.abs(s.outH - prevS.outH) + Math.abs(s.outV - prevS.outV), t = null, d = 1;
    if (Math.abs(dS) > 0.002){ t = "slew"; d = dS; }
    else if (Math.abs(dT) > 0.0005){ t = "tele"; d = dT; }
    else if (Math.abs(dL) > 0.002){ t = "luff"; d = dL; }
    else if (Math.abs(dH) > 0.0003){ t = "hoist"; d = dH; }
    else if (dO > 0.0002){ t = "out"; }
    if (t){
      sig.type = t; sig.dir = d > 0 ? 1 : -1; sigAt = performance.now();
      if (t === "slew"){           // point with the arm on the side the boom tip is moving toward
        var th = s.slew*D2R, ry = sigG.rotation.y;
        var tx = -Math.sin(th)*sig.dir, tz = -Math.cos(th)*sig.dir;
        sig.arm = (tx*-Math.cos(ry) + tz*Math.sin(ry)) > 0 ? "R" : "L";
      }
    }
  }
  prevS = {slew:s.slew, tele:s.tele, luff:s.luff, outH:s.outH, outV:s.outV, hookY:hookY};
}
function animSignal(now){
  var type = now - sigAt < 700 ? sig.type : (last.attached ? "stop" : "idle");
  var t = now/1000, w = 0.5 + 0.5*Math.sin(t*7), up = sig.dir > 0;
  var P = {R:[0,0,0,0], L:[0,0,0,0]}, a = "R", text;     // [shoulder x, shoulder z, elbow x, elbow z] in degrees, right-arm signs
  if (type === "hoist"){
    text = up ? "hoistUp" : "hoistDown";
    P.R = up ? [0,-90, 20*Math.sin(t*7), -90 + 15*Math.cos(t*7)] : [12*Math.sin(t*7), -45 + 8*Math.cos(t*7), 0, 0];
  } else if (type === "luff"){
    text = up ? "luffUp" : "luffDown";
    P.R = [0, up ? -90 - 30*w : -90 + 30*w, 0, 0];
  } else if (type === "tele"){
    text = up ? "teleOut" : "teleIn";
    var p = (t*0.9) % 1, spread = up ? 5 + 40*p : 45 - 40*p;
    P.R = [-75, -spread, 0, 0]; P.L = [-75, -spread, 0, 0];
  } else if (type === "slew"){
    text = "slew"; a = sig.arm; P[a] = [0, -90, 0, -22*w];
  } else if (type === "stop"){
    text = "stop"; P.R = [0, -155, 0, 0];
  } else text = type;
  ["R","L"].forEach(function(k){
    var arm = arms[k], m = k === "R" ? 1 : -1, c = arm.cur, tg = P[k];
    for (var i=0;i<4;i++) c[i] += (tg[i] - c[i])*0.22;

    arm.el.rotation.set(c[2]*D2R, 0, c[3]*m*D2R);
  });
  if (text !== sigText){
    sigText = text;
    var chip = $("chipSig");
    chip.textContent = tr("sigPrefix", tr("sig_" + text));
    chip.className = "chip" + (type === "idle" || type === "out" ? "" : type === "stop" ? " warn" : " on");
  }
}

  }
  box(0.45,1.1,0.1,M.yellowDk, C.px,0.95,C.pz+0.33, upper);       // boom foot brackets
  box(0.45,1.1,0.1,M.yellowDk, C.px,0.95,C.pz-0.33, upper);
  cyl(0.26,0.6,M.steel, -0.9,0.76,C.pz, upper,20).rotation.x = Math.PI/2;
  var b = buildBoom(upper, {base:[0.62,0.5], secs:[[0.56,0.44],[0.5,0.39],[0.44,0.34],[0.38,0.29],[0.32,0.24]], head:[0.5,0.55,0.34], sheave:0.16});
  return {carrier:carrier, outriggers:outs, upper:upper, boomG:b.boomG, sections:b.sections, luff:buildLuff(upper)};
}
function buildSite(){
  var g = new THREE.Group();
  var r = Math.max(C.loadW, C.loadD)*0.75 + 0.5;
  var edge = new THREE.Mesh(new THREE.RingGeometry(r, r+0.16, 4, 1), M.mark);
  edge.rotation.x = -Math.PI/2; edge.rotation.z = Math.PI/4;
  edge.position.set(pick.x, 0.03, pick.z); g.add(edge);
  box(C.loadW*0.92,0.1,0.2,M.grey, pick.x, 0.05, pick.z-C.loadD*0.3, g);     // dunnage
  box(C.loadW*0.92,0.1,0.2,M.grey, pick.x, 0.05, pick.z+C.loadD*0.3, g);
  var pw = C.loadW*1.5 + 2.6, pd = C.loadD*1.5 + 3, H = C.platH;
  box(pw,0.36,pd,M.concrete, place.x, H-0.18, place.z, g);
  [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(function(c){
    box(0.42, H-0.36, 0.42, M.concrete, place.x + c[0]*(pw/2-0.38), (H-0.36)/2, place.z + c[1]*(pd/2-0.38), g);
  });
  C.cones.forEach(function(p){
    var cone = new THREE.Mesh(new THREE.ConeGeometry(0.2,0.65,12), M.red);
    cone.position.set(p[0],0.325,p[1]); cone.castShadow = true; g.add(cone);
  });
  return g;
}
function buildLoad(){
  var g = new THREE.Group();
  box(C.loadW,C.loadH,C.loadD,M.load, 0,0,0, g);
  box(C.loadW+0.02,0.12,C.loadD+0.02,M.dark, 0,C.strapY,0, g);
  box(C.loadW+0.02,0.12,C.loadD+0.02,M.dark, 0,-C.strapY,0, g);
  return g;
}

/* ---------- state + apply ---------- */
var state = null, time = 0, playing = false, manual = false;
var UP = new THREE.Vector3(0,1,0), tmp = new THREE.Vector3();
var last = {};

function apply(){
  var s = state, f = fk(s), a = s.luff*D2R;
  R.carrier.position.y = f.lift;
  var jackExt = s.outV*C.jackStroke;
  R.outriggers.forEach(function(o){
    o.beam.position.z = o.side*s.outH*C.beamTravel;
    var len = 0.4 + jackExt;
    o.rod.scale.y = len; o.pad.position.y = -len + 0.04;
  });
  R.upper.rotation.y = s.slew*D2R;
  R.boomG.rotation.z = a;
  var ex = secExt(s.tele), cum = 0;
  R.sections.forEach(function(g,i){ cum += ex[i]; g.position.x = cum; });

  var ax = C.cylAtt[0], ay = C.cylAtt[1];
  var bx = C.px + ax*Math.cos(a) - ay*Math.sin(a), by = C.py + ax*Math.sin(a) + ay*Math.cos(a);
  tmp.set(bx - C.cylA[0], by - C.cylA[1], 0);
  var cl = tmp.length(); tmp.normalize();
  R.luff.forEach(function(c){
    c.b.quaternion.setFromUnitVectors(UP, tmp); c.r.quaternion.copy(c.b.quaternion);
    c.b.scale.y = Math.min(C.barrelMax, cl*0.96); c.r.scale.y = cl;
  });

  var attached = time >= tAttach && time < tRelease;
  var minHook = attached ? restHook : 0.25;
  var hookY = Math.min(f.hy - C.ropeMin, Math.max(minHook, f.hy - s.rope));
  rope.position.set(f.hx, f.hy, f.hz);
  rope.scale.y = Math.max(0.01, f.hy - (hookY + C.hookTop));
  hookG.position.set(f.hx, hookY, f.hz);

  var lp = attached ? {x:f.hx, y:hookY, z:f.hz} : (time < tAttach ? pick : place);
  var topY = lp.y - C.slingH;
  load.position.set(lp.x, topY - C.loadH/2, lp.z);
  slings.visible = attached;
  if (attached){
    var p = slingGeo.attributes.position.array, i = 0;
    [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(function(c){
      p[i++]=f.hx; p[i++]=hookY+0.1; p[i++]=f.hz;
      p[i++]=lp.x + c[0]*(C.loadW/2-0.12); p[i++]=topY; p[i++]=lp.z + c[1]*(C.loadD/2-0.08);
    });
    slingGeo.attributes.position.needsUpdate = true;
  }
  var r = Math.max(0.5, f.radius);
  ring.scale.set(r, r, 1); ring.position.set(C.cx, 0.025, 0);

  noteMotion(s, hookY);
  last = {f:f, hookY:hookY, attached:attached, jackExt:jackExt};
  updateUI();
}

/* ---------- UI ---------- */
var sliders = {outH:$("sOutH"), outV:$("sOutV"), slew:$("sSlew"), luff:$("sLuff"), tele:$("sTele"), rope:$("sRope")};
var outs = {outH:$("oOutH"), outV:$("oOutV"), slew:$("oSlew"), luff:$("oLuff"), tele:$("oTele"), rope:$("oRope")};
var tl = $("timeline");
var segEls = [], stepBtns = [], modelBtns = [], lastStep = -1;

function buildUI(){
  var segs = $("segs"), list = $("stepList"), groups = $("groups"), gDur = [0,0,0,0], gPrev = -1;
  [segs, list, groups, $("models")].forEach(function(e){ e.textContent = ""; });
  segEls = []; stepBtns = []; modelBtns = [];
  steps.forEach(function(st,i){
    var e = document.createElement("i");
    e.style.flex = st.dur + " 0 0"; e.style.background = GROUPS[st.g].color;
    segs.appendChild(e); segEls.push(e); gDur[st.g] += st.dur;
    if (st.g !== gPrev){
      var h = document.createElement("li"); h.className = "grp";
      var sw = document.createElement("i"); sw.style.background = GROUPS[st.g].color;
      h.appendChild(sw); h.appendChild(document.createTextNode(T.groups[st.g]));
      list.appendChild(h); gPrev = st.g;
    }
    var li = document.createElement("li"), b = document.createElement("button"), n = document.createElement("span");
    b.type = "button"; n.textContent = i+1; b.appendChild(n); b.appendChild(document.createTextNode(T.steps[i]));
    b.addEventListener("click", function(){ seek(steps[i].t0 + 0.001); setPlaying(true); });
    li.appendChild(b); list.appendChild(li); stepBtns.push(b);
  });
  GROUPS.forEach(function(g,i){
    var s = document.createElement("span");
    s.style.flex = gDur[i] + " 0 0"; s.style.borderColor = g.color; s.textContent = T.groups[i];
    groups.appendChild(s);
  });
  var bar = $("models");
  MODELS.forEach(function(m){
    var b = document.createElement("button"), sm = document.createElement("small");
    b.type = "button"; b.id = "model-" + m.id; b.textContent = m.type === "truck" ? tr("truck") : m.label; sm.textContent = tr(m.type === "truck" ? "subTruck" : "subRT"); b.appendChild(sm);
    b.setAttribute("aria-pressed", C === m ? "true" : "false");
    b.addEventListener("click", function(){ if (C !== m) setModel(m, true); });
    bar.appendChild(b); modelBtns.push(b);
  });
}

function setModel(m, keepTime){
  C = m;
  buildSteps();
  if (R) dropGroup(R.carrier);
  dropGroup(siteG); dropGroup(load);
  R = m.type === "truck" ? buildTruck() : buildRT();
  scene.add(R.carrier);
  siteG = buildSite(); scene.add(siteG);
  load = buildLoad(); scene.add(load);
  hookG.scale.setScalar(C.hookScale);
  placeSignalman(); prevS = null;
  mailMesh.position.set(C.mail[0], 0.035, C.mail[1]); mailMesh.scale.set(C.mail[2], C.mail[2], 1);
  sliders.luff.max = C.luffMax; sliders.rope.min = C.ropeMin; sliders.rope.max = C.ropeMax;
  tl.max = total;
  $("note").textContent = tr("note_" + C.id) + tr("noteEnd");
  modelBtns.forEach(function(b,i){ b.setAttribute("aria-pressed", MODELS[i] === m ? "true" : "false"); });
  if (!keepTime) time = 0;
  manual = false; lastStep = -1;
  state = stateAt(time);
  resetView(); apply();
}

function applyLang(lang){
  LANG = lang; T = I18N[lang];
  document.documentElement.lang = lang;
  Array.prototype.forEach.call(document.querySelectorAll("[data-i18n]"), function(e){ e.textContent = tr(e.getAttribute("data-i18n")); });
  canvas.setAttribute("aria-label", tr("scene"));
  $("models").setAttribute("aria-label", tr("model"));
  $("lang").setAttribute("aria-label", tr("lang")); $("lang").value = lang;
  $("speed").setAttribute("aria-label", tr("speed")); tl.setAttribute("aria-label", tr("timeline"));
  $("play").textContent = tr(playing ? "pause" : "play");
  $("note").textContent = tr("note_" + C.id) + tr("noteEnd");
  buildUI();
  lastStep = -1; sigText = "";
  if (state) updateUI();
}
function fmt(v,d){ return v.toFixed(d==null?1:d); }
function updateUI(){
  var s = state, f = last.f;
  KEYS.forEach(function(k){ if (document.activeElement !== sliders[k]) sliders[k].value = s[k]; });
  outs.outH.textContent = tr("span", fmt(2*(C.jackZ + C.beamTravel*s.outH), 2));
  outs.outV.textContent = Math.round(s.outV*100) + " %";
  outs.slew.textContent = fmt(s.slew, 0) + "°";
  outs.luff.textContent = fmt(s.luff) + "°";
  outs.tele.textContent = fmt(f.L) + " m";
  outs.rope.textContent = fmt(f.hy - last.hookY) + " m";
  $("rLen").textContent = fmt(f.L); $("rLuff").textContent = fmt(s.luff);
  $("rRad").textContent = fmt(f.radius); $("rSlew").textContent = fmt(s.slew % 360, 0);
  $("rHook").textContent = fmt(last.hookY);

  var co = $("chipOut"), grounded = last.jackExt >= C.jackGap - 0.001, ready = s.outH > 0.99 && s.outV > 0.99;
  co.className = "chip" + (ready ? " ok" : (s.outH > 0.01 || s.outV > 0.01 ? " on" : ""));
  co.textContent = ready ? tr("outReady", Math.round(f.lift*100))
    : grounded ? tr("outGround", Math.round(f.lift*100))
    : s.outV > 0.01 ? tr("outV", Math.round(s.outV*100))
    : s.outH > 0.01 ? tr("outH", Math.round(s.outH*100)) : tr("outNone");
  var cl = $("chipLoad");
  cl.className = "chip" + (last.attached ? " on" : (time >= tRelease ? " ok" : ""));
  cl.textContent = tr(last.attached ? "loadOn" : (time >= tRelease ? "loadDone" : "loadNone"));
  $("chipManual").hidden = !manual;
  var working = s.luff > 3 || s.tele > 0.02 || (s.slew % 360 > 2 && s.slew % 360 < 358);
  $("chipWarn").hidden = !(working && !ready);

  var i = stepIndexAt(time);
  if (i !== lastStep){
    lastStep = i;
    $("stepNo").textContent = tr("step", i+1, steps.length, T.groups[steps[i].g]);
    $("stepName").textContent = T.steps[i];
    segEls.forEach(function(e,j){ e.className = j < i ? "done" : (j === i ? "cur" : ""); });
    stepBtns.forEach(function(b,j){ if (j === i) b.setAttribute("aria-current","step"); else b.removeAttribute("aria-current"); });
  }
  if (document.activeElement !== tl || playing) tl.value = time;
  $("time").textContent = fmt(time) + " / " + fmt(total) + " s";
}
function setPlaying(p){
  playing = p; $("play").textContent = tr(p ? "pause" : "play");
  if (p) manual = false;
}
function seek(t){
  time = Math.min(total, Math.max(0, t)); manual = false;
  state = stateAt(time); apply();
}
KEYS.forEach(function(k){
  sliders[k].addEventListener("input", function(){
    setPlaying(false); manual = true;
    state[k] = parseFloat(sliders[k].value); apply();
  });
});
tl.addEventListener("input", function(){ setPlaying(false); seek(parseFloat(tl.value)); });
$("play").addEventListener("click", function(){
  if (!playing){
    if (time >= total - 0.01) time = 0;
    state = stateAt(time);
  }
  setPlaying(!playing); apply();
});
$("prev").addEventListener("click", function(){
  var i = stepIndexAt(time); setPlaying(false);
  seek(time - steps[i].t0 > 0.3 ? steps[i].t0 : steps[Math.max(0,i-1)].t0);
});
$("next").addEventListener("click", function(){
  var i = stepIndexAt(time); setPlaying(false);
  seek(i < steps.length-1 ? steps[i+1].t0 : total);
});
$("resetView").addEventListener("click", resetView);

/* ---------- loop ---------- */
function resize(){
  var w = stage.clientWidth, h = stage.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  camera.aspect = w/h; camera.updateProjectionMatrix();
}
if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
window.addEventListener("resize", resize);
resize();
LANGS.forEach(function(l){ var o = document.createElement("option"); o.value = l[0]; o.textContent = l[1]; $("lang").appendChild(o); });
$("lang").addEventListener("change", function(){
  try { localStorage.setItem("crane-lang", this.value); } catch (e) {}
  applyLang(this.value);
});
buildSteps(); applyLang(detectLang()); setModel(MODELS[0], false);

var prevT = performance.now();
function frame(now){
  var dt = Math.min(0.1, (now - prevT)/1000); prevT = now;
  if (playing){
    time += dt*parseFloat($("speed").value);
    if (time >= total){ time = total; setPlaying(false); }
    state = stateAt(time); apply();
  }
  animSignal(now);
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
if (!reduce) setPlaying(true);
})();
</script>
</body>
